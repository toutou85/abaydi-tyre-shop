<!DOCTYPE html>
<html lang="ar" dir="rtl">

<title>طلب شراء - عبايدي للعجلات</title>

<style>
body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f4f4f4;
    direction:rtl;
    margin:0;
    padding:15px;
}
.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
img{
    width:100%;
    border-radius:12px;
    margin-bottom:10px;
}
h3{
    text-align:center;
    margin:15px 0;
}
input,
select,
button{
    width:100%;
    padding:12px;
    margin:7px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px; /* 16px لمنع تكبير الصفحة تلقائيًا في الآيفون */
    box-sizing:border-box;
    font-family:inherit;
}
button{
    background:green;
    color:white;
    border:none;
    font-size:17px;
    cursor:pointer;
}
button:disabled{
    opacity:0.7;
    cursor:not-allowed;
}
#noticePopup{
    background:rgba(255,255,224,0.8);
    border:1px solid #ffc107;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    font-size:14px;
    line-height:1.7;
}
.spinner{
    width:40px;
    height:40px;
    border:4px solid #ddd;
    border-top:4px solid green;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto;
}
@keyframes spin{
    100%{ transform:rotate(360deg); }
}
#statusText{
    margin-top:10px;
    font-weight:bold;
}
.error{
    border:2px solid red !important;
    background:#ffe6e6;
}
.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    left:20px;
    margin:auto;
    width:fit-content;
    background:#e74c3c;
    color:white;
    padding:12px 16px;
    border-radius:8px;
    opacity:0;
    pointer-events:none;
    transition:0.4s;
    z-index:9999;
    max-width:90%;
}
.toast.show{
    opacity:1;
}

/* البحث */
.size-search-box{
    position:relative;
    width:100%;
}
#size{
    border:2px solid #ddd;
    padding:14px;
    outline:none;
    direction:ltr;
    text-align:right;
}
#size:focus{
    border-color:#2563eb;
}
.suggestions-box{
    position:absolute;
    top:100%;
    right:0;
    left:0;
    background:#fff;
    border:1px solid #ddd;
    max-height:300px;
    overflow-y:auto;
    border-radius:0 0 12px 12px;
    z-index:9999;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
    display:none;
    direction:ltr;
    text-align:left;
}
.suggestion-item{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #f1f1f1;
}
.suggestion-item:hover{
    background:#2563eb;
    color:white;
}
.no-result{
    padding:12px;
    text-align:center;
    color:#777;
    direction:rtl;
}

// إزالة التكرار
const uniqueSizes = [...new Set(tireSizes)];

// =========================================================
// البحث عن المقاس
// =========================================================
const input = document.getElementById("size");
const suggestionsBox = document.getElementById("sizeSuggestions");

// تحويل الأرقام العربية/الهندية إلى لاتينية
function normalizeDigits(str){
    return str
        .replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
        .replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d));
}

input.addEventListener("input", function(){
    let value = normalizeDigits(this.value).trim().toUpperCase().replace(/\s+/g,"");

    if(value === ""){
        suggestionsBox.style.display = "none";
        return;
    }

    let results = uniqueSizes.filter(size => size.includes(value));
    showSuggestions(results);
});

input.addEventListener("focus", function(){
    if(this.value.trim() !== ""){
        this.dispatchEvent(new Event("input"));
    }
});

function showSuggestions(results){
    suggestionsBox.innerHTML = "";

    if(results.length === 0){
        suggestionsBox.innerHTML =
            '<div class="no-result">لا توجد نتائج، يمكنك كتابة المقاس يدويًا</div>';
        suggestionsBox.style.display = "block";
        return;
    }

    results.slice(0,50).forEach(size => {
        let div = document.createElement("div");
        div.className = "suggestion-item";
        div.textContent = size;
        div.onclick = () => {
            input.value = size;
            input.classList.remove("error");
            suggestionsBox.style.display = "none";
        };
        suggestionsBox.appendChild(div);
    });

    suggestionsBox.style.display = "block";
}

// إغلاق القائمة عند الضغط خارجها
document.addEventListener("click", function(e){
    if(!document.querySelector(".size-search-box").contains(e.target)){
        suggestionsBox.style.display = "none";
    }
});

// إزالة اللون الأحمر عند بدء الكتابة
["name","phone","phone2","wilaya","size","qty"].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener("input",  () => el.classList.remove("error"));
    el.addEventListener("change", () => el.classList.remove("error"));
});

// =========================================================
// دوال مساعدة
// =========================================================
function validateField(field){
    if(field.value.trim() === ""){
        field.classList.add("error");
        return false;
    }
    field.classList.remove("error");
    return true;
}

let toastTimer = null;
function showToast(msg){
    let toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove("show"), 3000);
}

// تنظيف رقم الهاتف: أرقام لاتينية، بدون مسافات أو شرطات،
// وتحويل +213 / 00213 / 213 إلى 0
function cleanPhone(phone){
    let p = normalizeDigits(phone).trim().replace(/[\s\-().]/g,"");
    if(p.startsWith("+213")) p = "0" + p.slice(4);
    else if(p.startsWith("00213")) p = "0" + p.slice(5);
    else if(p.startsWith("213") && p.length === 12) p = "0" + p.slice(3);
    return p;
}

// رقم جزائري: 05 / 06 / 07 + 8 أرقام
function isValidAlgerianPhone(phone){
    return /^0[567]\d{8}$/.test(cleanPhone(phone));
}

function formatPhone(phone){
    let p = cleanPhone(phone);
    if(!p) return "";
    return "+213" + p.slice(1);
}

function resetStatus(){
    document.getElementById("statusBox").style.display = "none";
}

// =========================================================
// الإرسال
// =========================================================
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzRtmH36UY4xlxJOnAe5gwIB-7G2a3IWODfPp3n3U_Y2NsdShOQ816CfQRvVfuvMWtuJA/exec";

document.getElementById("sendBtn").addEventListener("click", sendAll);

function sendAll(){

    let btn  = document.getElementById("sendBtn");
    let box  = document.getElementById("statusBox");
    let text = document.getElementById("statusText");
    let spinner = document.getElementById("spinner");

    text.style.color = "";
    resetStatus();

    let nameField   = document.getElementById("name");
    let phoneField  = document.getElementById("phone");
    let phone2Field = document.getElementById("phone2");
    let wilayaField = document.getElementById("wilaya");
    let sizeField   = document.getElementById("size");
    let qtyField    = document.getElementById("qty");

    // تحقق من الحقول الإلزامية
    let required = [nameField, phoneField, wilayaField, sizeField, qtyField];
    let firstError = null;

    required.forEach(f => {
        if(!validateField(f) && !firstError){
            firstError = f;
        }
    });

    if(firstError){
        showToast("⚠️ يرجى ملء جميع الخانات");
        firstError.focus();
        return;
    }

    // تحقق من الهاتف
    if(!isValidAlgerianPhone(phoneField.value)){
        phoneField.classList.add("error");
        showToast("⚠️ رقم الهاتف غير صحيح (مثال: 0551234567)");
        phoneField.focus();
        return;
    }

    if(phone2Field.value.trim() && !isValidAlgerianPhone(phone2Field.value)){
        phone2Field.classList.add("error");
        showToast("⚠️ رقم الهاتف الإضافي غير صحيح");
        phone2Field.focus();
        return;
    }

    // تحقق من الكمية (عدد صحيح موجب)
    let qtyNum = Number(qtyField.value);
    if(!Number.isInteger(qtyNum) || qtyNum <= 0){
        qtyField.classList.add("error");
        showToast("⚠️ الرجاء إدخال كمية صحيحة");
        qtyField.focus();
        return;
    }

    let name   = nameField.value.trim();
    let wilaya = wilayaField.value;
    let size   = normalizeDigits(sizeField.value).trim().toUpperCase().replace(/\s+/g,"");
    let phone  = formatPhone(phoneField.value);
    let phone2 = formatPhone(phone2Field.value);
    let dateString = new Date().toLocaleString("fr-FR");

    let data = { date: dateString, name, phone, phone2, wilaya, size, qty: qtyNum };

    let message =
`🛞 طلب جديد

📅 ${dateString}

👤 ${name}

📞 ${phone}

📞 إضافي: ${phone2 || "لا يوجد"}

📍 ${wilaya}

🚗 ${size}

🔢 ${qtyNum}`;

    // نفتح نافذة واتساب الآن (داخل حدث النقر) حتى لا يحجبها المتصفح،
    // ثم نوجهها إلى الرابط بعد نجاح الإرسال
    let waWindow = window.open("", "_blank");

    box.style.display = "block";
    spinner.style.display = "block";
    text.textContent = "⏳ جاري إرسال الطلب...";
    btn.disabled = true;
    btn.textContent = "جاري الإرسال...";

    // no-cors: سكربت جوجل لا يرسل ترويسات CORS، وبدونها كان الطلب
    // يُحفظ في الجدول لكن تظهر رسالة خطأ للزبون
    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
    })
    .then(() => {

        let waUrl = "https://wa.me/213698749015?text=" + encodeURIComponent(message);

        if(waWindow && !waWindow.closed){
            waWindow.location.href = waUrl;
        } else {
            window.location.href = waUrl;
        }

        spinner.style.display = "none";
        text.textContent = "✅ تم إرسال الطلب بنجاح";
        text.style.color = "green";

        // تفريغ الحقول
        document.querySelectorAll("input").forEach(i => i.value = "");
        document.querySelectorAll("select").forEach(s => s.selectedIndex = 0);
        suggestionsBox.style.display = "none";
    })
    .catch(() => {

        if(waWindow && !waWindow.closed) waWindow.close();

        spinner.style.display = "none";
        text.textContent = "❌ حدث خطأ، تأكد من اتصالك بالانترنت وحاول مجدداً";
        text.style.color = "red";
    })
    .finally(() => {
        btn.disabled = false;
        btn.textContent = "إرسال الطلب";
    });
}
